name: Build and Deploy Quartz
on:
  push:
    branches: [v4]
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ./

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Требуется для Quartz v4.5+
          cache: 'npm'  # Кэширует node_modules для ускорения

      - name: Install Dependencies
        run: npm ci  # Чистая установка (быстрее npm install в CI)

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public  # Output Quartz в public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
